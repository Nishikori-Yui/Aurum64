name: Source archive

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test offline source packaging
        run: python3 -B -m unittest discover -s Tests -p 'test_source*.py' -v
      - name: Test portable bundle policy
        run: python3 -B -m unittest discover -s Tests -p 'test_bundle_audit.py' -v
      - name: Check source snapshot reproducibility
        run: |
          python3 -B scripts/source_archive.py --output .build/source-a.tar.gz
          python3 -B scripts/source_archive.py --output .build/source-b.tar.gz
          cmp .build/source-a.tar.gz .build/source-b.tar.gz
      - name: Verify extracted inputs and prepare core without Git metadata
        run: |
          mkdir .build/extracted
          tar -xzf .build/source-a.tar.gz -C .build/extracted
          cd .build/extracted/Aurum64-*-source
          test ! -e .git
          python3 -B scripts/source_inputs.py verify
          python3 -B scripts/prepare_core.py
